name = "yfitops"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# O app web (apps/web/dist) é servido pelo mesmo Worker; /api/* vai para o código.
[assets]
directory = "../apps/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "yfitops"
database_id = "b051af3c-4b5d-4242-aa03-1679e2d15137"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yfitops-music"

[vars]
# APP_URL: opcional. Sem ele, o link de recuperação usa o endereço do próprio Worker.
# Remetente do e-mail de recuperação (domínio verificado no Resend).
MAIL_FROM = "Yfitops <onboarding@resend.dev>"
# Quem vê o painel administrativo (aprova pedidos de acesso, apaga músicas do
# sistema). Para os outros, o painel não existe.
ADMIN_EMAILS = "gabriel.jalleswork@hotmail.com"
# Limite TOTAL da nuvem, somando todas as contas, em GB (o R2 é grátis até 10 GB).
QUOTA_GB = "9.5"

# Faxina do catálogo: junta músicas duplicadas e limpa envios abandonados.
# Todo dia às 6h UTC (3h em Brasília).
[triggers]
crons = ["0 6 * * *"]

# Segredos (wrangler secret put …  /  .dev.vars em desenvolvimento):
# ESCROW_PRIVATE_KEY, ESCROW_PUBLIC_KEY  → npm run gen-escrow -w server
# ALLOWED_EMAILS                         → (opcional) e-mails já aprovados, sem esperar o administrador
# RESEND_API_KEY                         → envio de e-mails (código de cadastro e recuperação);
#                                          sem ele, os e-mails aparecem só no log

name = "yfitops"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# O app web (apps/web/dist) é servido pelo mesmo Worker; /api/* vai para o código.
[assets]
directory = "../apps/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "yfitops"
database_id = "b051af3c-4b5d-4242-aa03-1679e2d15137"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yfitops-music"

[vars]
# APP_URL: opcional. Sem ele, o link de recuperação usa o endereço do próprio Worker.
# Remetente do e-mail de recuperação (domínio verificado no Resend).
MAIL_FROM = "Yfitops <onboarding@resend.dev>"
# Quem vê o painel administrativo (aprova pedidos de acesso, apaga músicas do
# sistema). Para os outros, o painel não existe.
ADMIN_EMAILS = "gabriel.jalleswork@hotmail.com"
# Cadastro sem código por e-mail (o Resend sem domínio só entrega na caixa do dono
# da conta): basta a aprovação do administrador. O código continua existindo só
# para o e-mail de administrador e vai para a caixa abaixo. Com um domínio
# verificado no Resend, mude EMAIL_CODES para "on".
EMAIL_CODES = "off"
ADMIN_MAILBOX = "gabriel.jallesworkg@gmail.com"
# Consumo no painel (os números vêm da API de Analytics da Cloudflare).
# A chave vai como segredo: npx wrangler secret put CF_API_TOKEN
CF_ACCOUNT_ID = "257b7ba9c259f0ace1681beb9e33dfed"
D1_DATABASE_ID = "b051af3c-4b5d-4242-aa03-1679e2d15137"
R2_BUCKET_NAME = "yfitops-music"
WORKER_NAME = "yfitops"
# Limite TOTAL da nuvem, somando todas as contas, em GB (o R2 é grátis até 10 GB).
QUOTA_GB = "9.5"
# Dias grátis a partir da aprovação da conta; depois disso, só com meses liberados no Painel.
TRIAL_DAYS = "7"
# Como pagar: aparece para quem está vencendo ou vencido e vai na mensagem de cobrança do WhatsApp.
PAYMENT_INFO = "R$ 9 por mês via Pix. Chave: COLE_AQUI_SUA_CHAVE_PIX. Depois de pagar, mande o comprovante no WhatsApp."

# Faxina do catálogo: junta músicas duplicadas e limpa envios abandonados.
# Todo dia às 6h UTC (3h em Brasília).
[triggers]
crons = ["0 6 * * *"]

# Segredos (wrangler secret put …  /  .dev.vars em desenvolvimento):
# ESCROW_PRIVATE_KEY, ESCROW_PUBLIC_KEY  → npm run gen-escrow -w server
# ALLOWED_EMAILS                         → (opcional) e-mails já aprovados, sem esperar o administrador
# CF_API_TOKEN                           → (opcional) consumo no painel: token "Account Analytics: Read"
# RESEND_API_KEY                         → envio de e-mails (código de cadastro e recuperação);
#                                          sem ele, os e-mails aparecem só no log
